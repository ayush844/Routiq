networks:
  routiq_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - routiq_net

  relay-1:
    profiles: ["multi-relay", "prod"]
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    env_file:
      - apps/relay/.env
    environment:
      RELAY_ID: relay-1
      WS_PORT: 8081
      HTTP_PORT: 3001
      PUBLIC_HTTP_PORT: "443"
      TUNNEL_DOMAIN: routiq.dev
      PUBLIC_TUNNEL_SCHEME: https
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      routiq_net:
        ipv4_address: 172.28.0.11

  relay-2:
    profiles: ["multi-relay", "prod"]
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    env_file:
      - apps/relay/.env
    environment:
      RELAY_ID: relay-2
      WS_PORT: 8082
      HTTP_PORT: 3002
      PUBLIC_HTTP_PORT: "443"
      TUNNEL_DOMAIN: routiq.dev
      PUBLIC_TUNNEL_SCHEME: https
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      routiq_net:
        ipv4_address: 172.28.0.12

  nginx:
    profiles: ["multi-relay"]
    image: nginx:alpine
    ports:
      - "8080:8080"
      - "3001:3001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - relay-1
      - relay-2
    restart: unless-stopped
    networks:
      - routiq_net

  nginx-prod:
    profiles: ["prod"]
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - relay-1
      - relay-2
    restart: unless-stopped
    networks:
      - routiq_net

volumes:
  redis_data:
