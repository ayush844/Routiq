worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream relay_ws {
    ip_hash;
    server relay-1:8081 max_fails=3 fail_timeout=10s;
    server relay-2:8082 max_fails=3 fail_timeout=10s;
  }

  upstream relay_http {
    server relay-1:3001 max_fails=3 fail_timeout=10s;
    server relay-2:3002 max_fails=3 fail_timeout=10s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://relay_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400;
    }
  }

  server {
    listen 3001;

    location / {
      proxy_pass http://relay_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
    }
  }
}
