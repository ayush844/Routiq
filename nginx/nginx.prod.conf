worker_processes auto;

events {
  worker_connections 2048;
}

http {
  upstream relay_ws {
    ip_hash;
    server relay-1:8081 max_fails=3 fail_timeout=10s;
    server relay-2:8082 max_fails=3 fail_timeout=10s;
  }

  upstream relay_http {
    server relay-1:3001 max_fails=3 fail_timeout=10s;
    server relay-2:3002 max_fails=3 fail_timeout=10s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name relay.routiq.dev *.routiq.dev;
    return 301 https://$host$request_uri;
  }

  # CLI WebSocket + relay API (auth, health)
  server {
    listen 443 ssl;
    http2 on;
    server_name relay.routiq.dev;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /health {
      proxy_pass http://relay_http;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
      proxy_pass http://relay_http;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://relay_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }
  }

  # Tunnel HTTP ingress (wildcard subdomains)
  server {
    listen 443 ssl;
    http2 on;
    server_name *.routiq.dev;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://relay_http;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }
  }
}
